<circle cx="28" cy="70.8" r="2.6" fill="#1E2A38"/>
<text x="38.0" y="75.6" font-size="16" text-anchor="start" font-weight="400" fill="#1E2A38">Столовая (арендатор): меню,</text>
<text x="38.0" y="95.1" font-size="16" text-anchor="start" font-weight="400" fill="#1E2A38">кухня, место выдачи</text>
<circle cx="28" cy="115.83999999999999" r="2.6" fill="#1E2A38"/>
<text x="38.0" y="120.6" font-size="16" text-anchor="start" font-weight="400" fill="#1E2A38">Payme, Click, Uzum: приём оплаты</text>
<text x="38.0" y="140.2" font-size="16" text-anchor="start" font-weight="400" fill="#1E2A38">и фискальный чек (C-02, C-03)</text>
<circle cx="28" cy="160.88" r="2.6" fill="#1E2A38"/>
<text x="38.0" y="165.7" font-size="16" text-anchor="start" font-weight="400" fill="#1E2A38">SMS-шлюз Eskiz: код входа</text>
<text x="38.0" y="185.2" font-size="16" text-anchor="start" font-weight="400" fill="#1E2A38">(FR-15)</text>
<circle cx="28" cy="205.92" r="2.6" fill="#1E2A38"/>
<text x="38.0" y="210.7" font-size="16" text-anchor="start" font-weight="400" fill="#1E2A38">Telegram: уведомление «Готов»</text>
<text x="38.0" y="230.2" font-size="16" text-anchor="start" font-weight="400" fill="#1E2A38">(FR-11)</text>
<circle cx="28" cy="250.95999999999998" r="2.6" fill="#1E2A38"/>
<text x="38.0" y="255.8" font-size="16" text-anchor="start" font-weight="400" fill="#1E2A38">Администрация университета:</text>
<text x="38.0" y="275.3" font-size="16" text-anchor="start" font-weight="400" fill="#1E2A38">расписание перемен, точка выдачи</text>
<text x="38.0" y="294.8" font-size="16" text-anchor="start" font-weight="400" fill="#1E2A38">(C-04)</text>
<circle cx="28" cy="315.52" r="2.6" fill="#1E2A38"/>
<text x="38.0" y="320.3" font-size="16" text-anchor="start" font-weight="400" fill="#1E2A38">Хостинг в Узбекистане (C-01)</text>
