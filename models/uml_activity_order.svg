<text x="190.0" y="154.9" font-size="14" text-anchor="middle" font-weight="400" fill="#1E2A38">Открыть меню дня</text>
<path d="M540,128 L562,150 L540,172 L518,150 Z" fill="#F3ECDD" stroke="#33475E" stroke-width="1.6"/>
<text x="540.0" y="117.2" font-size="13" text-anchor="middle" font-weight="600" fill="#1E2A38">Меню опубликовано?</text>
<rect x="635.0" y="203.0" width="170.0" height="54.0" rx="16" fill="#FFFFFF" stroke="#33475E" stroke-width="1.6"/>
<text x="720.0" y="226.4" font-size="14" text-anchor="middle" font-weight="400" fill="#1E2A38">Показать «Меню ещё</text>
<text x="720.0" y="243.4" font-size="14" text-anchor="middle" font-weight="400" fill="#1E2A38">не готово»</text>
<circle cx="720" cy="300" r="13" fill="#fff" stroke="#0F2E57" stroke-width="2"/><circle cx="720" cy="300" r="7.5" fill="#0F2E57"/>
<rect x="450.0" y="218.0" width="180.0" height="54.0" rx="16" fill="#FFFFFF" stroke="#33475E" stroke-width="1.6"/>
<text x="540.0" y="241.4" font-size="14" text-anchor="middle" font-weight="400" fill="#1E2A38">Показать позиции с</text>
<text x="540.0" y="258.4" font-size="14" text-anchor="middle" font-weight="400" fill="#1E2A38">остатком больше 0</text>
<rect x="105.0" y="303.0" width="170.0" height="54.0" rx="16" fill="#FFFFFF" stroke="#33475E" stroke-width="1.6"/>
<text x="190.0" y="326.4" font-size="14" text-anchor="middle" font-weight="400" fill="#1E2A38">Добавить блюда в</text>
<text x="190.0" y="343.4" font-size="14" text-anchor="middle" font-weight="400" fill="#1E2A38">корзину</text>
<path d="M190,403 L212,425 L190,447 L168,425 Z" fill="#F3ECDD" stroke="#33475E" stroke-width="1.6"/>
<text x="160.0" y="421.6" font-size="13" text-anchor="end" font-weight="600" fill="#1E2A38">Не больше</text>
<text x="160.0" y="437.5" font-size="13" text-anchor="end" font-weight="600" fill="#1E2A38">остатка?</text>
<rect x="450.0" y="398.0" width="180.0" height="54.0" rx="16" fill="#FFFFFF" stroke="#33475E" stroke-width="1.6"/>
<text x="540.0" y="421.4" font-size="14" text-anchor="middle" font-weight="400" fill="#1E2A38">Показать «Осталось N</text>
<text x="540.0" y="438.4" font-size="14" text-anchor="middle" font-weight="400" fill="#1E2A38">шт.»</text>
<rect x="105.0" y="493.0" width="170.0" height="54.0" rx="16" fill="#FFFFFF" stroke="#33475E" stroke-width="1.6"/>
<text x="190.0" y="516.4" font-size="14" text-anchor="middle" font-weight="400" fill="#1E2A38">Выбрать окно</text>
<text x="190.0" y="533.4" font-size="14" text-anchor="middle" font-weight="400" fill="#1E2A38">получения</text>
<rect x="95.0" y="578.0" width="190.0" height="64.0" rx="16" fill="#FFFFFF" stroke="#33475E" stroke-width="1.6"/>
<text x="190.0" y="597.8" font-size="14" text-anchor="middle" font-weight="400" fill="#1E2A38">Нажать «Оплатить»,</text>
<text x="190.0" y="614.9" font-size="14" text-anchor="middle" font-weight="400" fill="#1E2A38">выбрать Payme, Click</text>
<text x="190.0" y="632.0" font-size="14" text-anchor="middle" font-weight="400" fill="#1E2A38">или Uzum</text>
<path d="M540,588 L562,610 L540,632 L518,610 Z" fill="#F3ECDD" stroke="#33475E" stroke-width="1.6"/>
<text x="570.0" y="606.6" font-size="13" text-anchor="start" font-weight="600" fill="#1E2A38">Окно открыто, лимит</text>
<text x="570.0" y="622.5" font-size="13" text-anchor="start" font-weight="600" fill="#1E2A38">не достигнут?</text>
<rect x="635.0" y="493.0" width="170.0" height="54.0" rx="16" fill="#FFFFFF" stroke="#33475E" stroke-width="1.6"/>
<text x="720.0" y="516.4" font-size="14" text-anchor="middle" font-weight="400" fill="#1E2A38">Показать «Окно</text>
<text x="720.0" y="533.4" font-size="14" text-anchor="middle" font-weight="400" fill="#1E2A38">заполнено»</text>
<rect x="450.0" y="673.0" width="180.0" height="54.0" rx="16" fill="#FFFFFF" stroke="#33475E" stroke-width="1.6"/>
<text x="540.0" y="696.4" font-size="14" text-anchor="middle" font-weight="400" fill="#1E2A38">Зарезервировать</text>
<text x="540.0" y="713.4" font-size="14" text-anchor="middle" font-weight="400" fill="#1E2A38">остаток на 10 минут</text>
